[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "ctae"
version = "0.4.3"
description = "Canadian Tree Allometric Equations - Python implementation"
readme = "README_PYTHON.md"
requires-python = ">=3.8"
license = {text = "GPL-3.0"}
authors = [
    {name = "Piotr Tompalski", email = "piotr.tompalski@NRCan-RNCan.gc.ca"},
]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/casmacdo/CTAE"
